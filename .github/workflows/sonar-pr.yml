name: SonarCloud PR Analysis

on:
  pull_request:
    branches: [main]

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Shallow clones break SonarCloud blame annotations and new-code detection
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Frontend coverage is fed into the Sonar scan via
      # sonar.typescript.lcov.reportPaths in sonar-project.properties
      - name: Install frontend dependencies
        working-directory: settlespace-react
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: settlespace-react
        run: npm run test:ci

      # Scripts node_modules needed for sonar-scanner to evaluate JS sources
      - name: Install scripts dependencies
        working-directory: scripts
        run: npm ci

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Wait for the quality gate result — a failed gate fails this job
          # and blocks the PR merge check
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
